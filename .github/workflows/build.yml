name: 🏗️ Build

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: 📥 Checkout code
              uses: actions/checkout@v4

            - name: 🥟 Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest

            - name: 📦 Install dependencies
              run: bun install

            - name: 🔨 Build extension
              run: bun run build

            - name: 📤 Upload build artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: build-artifacts
                  path: release/
                  retention-days: 30
